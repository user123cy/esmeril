[package]
name = "esmeril"
version = "0.1.0"
edition = "2024"
description = "Scaffold, check and inspect Roblox Luau projects"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/user123cy/esmeril"
documentation = "https://docs.rs/esmeril"
repository = "https://github.com/user123cy/esmeril"
keywords = ["roblox", "luau", "rojo", "cli", "scaffold"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
ureq = "2"
